  #   | stats count by badge_id
  # on seal_2's data gets double-counted hits. The intended teaching
  # is `| dedup _time badge_id` or `| bin _time span=2s | stats …`.
  # We seed 8 known-doubled swipes for Takagi's vault-check cycle,
  # each already paired with a "ghost" second hit produced at
  # generation time. No new badges, no new puzzle — just realism.
  dedup_traps:
    - badge_id: JT-0001
      floor: 30
      room: Vault Access Corridor
      reader: RDR-30-NORTH
      count: 8
      ghost_delay_seconds_min: 0.4
      ghost_delay_seconds_max: 0.8
      detail: "badge reader debounce glitch — double-read"

  # ── v2.9 / Phase 6 — Cross-index echoes (multi-index scoping) ───
  # These sit in nakatomi_building (intranet:it / maintenance tickets)
  # and REFERENCE the puzzle-critical badge IDs in their message text.
  # A player doing `index=* badge_id=JT-0001` or searching loosely
  # across indexes sees these hits and may miscount or misread.
  # Teaching: scope queries to `index=nakatomi_access` for badge
  # swipes, not `index=*`.
  cross_index_echoes:
    - badge_id: JT-0001
      count: 4
      source: intranet:it
      message_template: "IT ticket #{tid} — inventory audit references badge {badge} for vault maintenance scheduling; no action required"
    - badge_id: HT-0001
      count: 3
      source: intranet:hr
      message_template: "HR note #{tid} — performance review packet for {badge} forwarded to exec archive; admin only"
    - badge_id: HE-3301
      count: 3
      source: intranet:it
      message_template: "IT ticket #{tid} — badge {badge} flagged for re-issue (worn magstripe); schedule replacement Jan 2"
    - badge_id: TH-0099
      count: 3
      source: proxy:http
      message_template: "proxy log — user_badge={badge} referenced url_category=business; allow"

# ── Trap Code Lore (v2.9 / Phase 6) ──────────────────────────────
# Historically the keypad "trap codes" just triggered a security
# alert + wrong-count penalty. v2.9 promotes each to a proper
# red-herring side path: hitting a trap now also flashes a
# one-sentence lore card explaining *why* that number is a
# reasonable-looking guess. Still penalising (the wrong_count still
# bumps), but now it teaches narrative rather than punishing
# silently.
#
# Consumed by game.html at script-eval time (see TRAP_CODE_LORE)
# via the existing handleTrapCode() flow. Keep entries terse — the
# toast is transient (~3.5s) and shouldn't distract from the main
# puzzle.
trap_code_lore:
  "1990": "The year Takagi finalised the Nakatomi charter. Historically meaningful — not vault-meaningful."
  "0911": "Emergency dispatch. McClane might approve. Hans never would."
  "1666": "The Great Fire of London. Hans admires the architecture — not the arson."
  "1988": "The current year, sir. Hans would never choose something so obvious."

# ── Side Stories (v2.9 / Phase 6) ────────────────────────────────
# Eight hand-authored side mysteries seeded into the dataset. Each
# one is independently discoverable by a curious analyst — none are
# required to finish the main heist, but together they paint a
# richer portrait of Nakatomi Plaza on Christmas Eve 1988.
#
# Each story embeds a unique 4-digit `discovery_code` somewhere in
# its event trail (usually in a `detail=` or `message=` field). The
# in-game keypad recognises these codes as side-story reveals and
# pops a toast with the narrative payoff. The `spl_hint` field
# documents the intended query path (used by facilitator tooling
# and docs/STORY_AND_MYSTERIES.md).
#
# Naming: `id` stays short/snake_case (used as a JS key). Codes are
# chosen to be memorable but unlikely to collide with seal codes
# (2512 / 7439 / 4291 / 8086 / 5765 / 3940) or the existing trap
# codes (1990 / 0911 / 1666 / 1988 / 1215). Clearance flag: codes
# starting with 9 are reserved for side-story reveals.
side_stories:
  - id: affair
    title: "The Affair"
    category: romance
    discovery_code: "9012"
    achievement: side_affair
    spl_hint: 'index=nakatomi_access badge_id=HE-3301 floor=30 earliest=-4d@d | sort _time'
    teaser: "Someone's been visiting Holly's floor after hours."
    payoff: "Harry Ellis has been making late-night trips to floor 30 all week. Holly's office. Roses on Dec 20. A note: 'H. — tonight? — H.' They weren't just colleagues. Hans will never know — but you do."
  - id: petty_cash
    title: "Petty Cash Skim"
    category: fraud
    discovery_code: "9050"
    achievement: side_petty_cash
    spl_hint: 'index=nakatomi_building sourcetype=intranet:finance amount<100 | stats sum(amount) by requester'
    teaser: "Something's off with the coffee-fund reimbursements."
    payoff: "Accounting clerk Ulysses Bekele (NP-2802) has been skimming $40-50 every few days for six months, logged as 'office supplies' and 'coffee fund'. Total take: $4,892. He was one tightening audit away from being caught."
  - id: ghost_account
    title: "The Ghost Account"
    category: security
    discovery_code: "9099"
    achievement: side_ghost
    spl_hint: 'index=nakatomi_access | lookup employee_directory.csv badge_id | search status=terminated'
    teaser: "A terminated employee's badge is still warm."
    payoff: "Badge XG-9999 belongs to 'Evan Rutherford' — terminated eight months ago, but the badge still swipes into the server room on floor 25 after hours. Someone on IT never killed the credential. A backdoor hiding in plain sight."
  - id: y2k
    title: "The Y2K Test"
    category: comedy
    discovery_code: "9200"
    achievement: side_y2k
    spl_hint: 'index=nakatomi_building sourcetype=intranet:it "Y2K"'
    teaser: "Something in the IT logs insists it's already 1900."
    payoff: "R&D's millennium-bug team ran a date-rollover test on Dec 22 that tipped every timestamp to 1900-01-01 for forty seconds — then quietly rolled back. The IT director's memo: 'do NOT tell the auditors.' Corporate America, ladies and gentlemen."
  - id: disgruntled_it
    title: "The Disgruntled Sysadmin"
    category: insider
    discovery_code: "9315"
    achievement: side_disgruntled
    spl_hint: 'index=nakatomi_access badge_id=NP-4471 earliest=-7d@d | where date_hour>21 | stats count by floor'
    teaser: "One engineer's been poking everywhere he shouldn't be."
    payoff: "Robert Chen (NP-4471) has been pulling late-night admin swipes on floors 25 and B1 all week — he was passed over for a VP slot in October and HR has him on a PIP. An after-hours email drafted on his workstation read: 'they'll regret this.' He hit delete. He didn't hit purge."
  - id: pizza
    title: "The Pineapple Incident"
    category: comedy
    discovery_code: "9086"
    achievement: side_pizza
    spl_hint: 'index=nakatomi_building "pineapple"'
    teaser: "Someone started a war on floor 15 at 1pm yesterday."
    payoff: "On Dec 23 at 13:14 PST, Catering delivered 12 pizzas to the trading floor. One was Hawaiian. The resulting intranet thread ran 37 messages in 40 minutes before IT muted the channel. Nobody confessed to ordering it. The pizza was eaten anyway. Mostly."
  - id: theo_browser
    title: "Theo's Homework"
    category: insider
    discovery_code: "9552"
    achievement: side_theo
    spl_hint: 'index=nakatomi_building sourcetype=proxy:http user_badge=TH-0099 | stats count by url_category'
    teaser: "The proxy log says someone's been researching something strange."
    payoff: "Theo (TH-0099) logged 147 proxy hits over the last three weeks — all on vault-cracking whitepapers, seismic demolition case studies, and the SEC filing for Nakatomi's $640M in bearer bonds. Masquerading as a catering vendor took some homework. He passed the exam."
  - id: bypassed_camera
    title: "The Blind Spot"
    category: security
    discovery_code: "9425"
    achievement: side_camera
    spl_hint: 'index=nakatomi_building system=security event_type=camera_offline'
    teaser: "One camera went down at the worst possible moment."
    payoff: "Camera CAM-25-NORTH went offline at 21:42 — 'scheduled maintenance' per the ticket. Nobody scheduled it. Eighteen minutes later, Hans's crew walked through the loading dock under it. Someone inside the building knew exactly which blind spot to use — and exactly when."

# ── Easter Eggs (v2.9 / Phase 6d) ────────────────────────────────
# Fifteen hidden moments scattered across the game and the dataset.
# Fourteen are discovered by SPL + keypad entry (6xxx namespace);
# one (the Konami code) lives entirely in game.html. The TOAST text
# and registry authoritatively live in game.html → EASTER_EGGS; this
# YAML block drives the generator's data seeding ONLY.
#
# Each entry specifies where the hint appears in the dataset so the
# Python generator can emit exactly one matching event per egg. Text
# and timestamps are authored for narrative effect — not for puzzle
# difficulty — so booth demos still get the full easter-egg roster.
#
# Naming:
#   id              — matches EASTER_EGG id in game.html
#   discovery_code  — matches EASTER_EGG code in game.html (6xxx
#                     namespace; Konami has no code)
#   index/sourcetype — where the event lands for SPL discovery
#   timestamp_hint  — ISO-ish "YYYY-MM-DDTHH:MM:SS" PST (no tz); the
#                     generator reinterprets relative to the scenario
#                     timeline
#   fields          — key=value pairs to embed in the event (all
#                     narrative fingerprints — "yippee", "HAL9000",
#                     "pineapple", etc. — should appear here so a
#                     naive SPL search finds the egg)
