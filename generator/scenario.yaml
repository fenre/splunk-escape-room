# Nakatomi Plaza: Vault Heist — Scenario Configuration
#
# This file drives the data generator. Change seal codes here to produce
# a fresh dataset for each event. Keep the structure; the generator
# relies on these keys.

game:
  title: "Nakatomi Plaza: Vault Heist"
  duration_minutes: 60
  max_wrong_codes: 3
  date: "1988-12-24"
  timezone: "America/Los_Angeles"

# Random seed — same seed = same dataset. Change for a new game.
seed: 19881215

# ── Timeline (ISO 8601, local time) ──────────────────────────────
timeline:
  party_setup:          "1988-12-24T18:00:00"
  party_start:          "1988-12-24T20:00:00"
  takeover:             "1988-12-24T22:00:00"
  lobby_secured:        "1988-12-24T22:02:00"
  floors_secured:       "1988-12-24T22:10:00"
  takagi_confrontation: "1988-12-24T22:20:00"
  takagi_session_end:   "1988-12-24T22:25:00"
  vault_work_begins:    "1988-12-24T22:30:00"
  mcclane_first:        "1988-12-24T22:45:00"
  fbi_arrives:          "1988-12-24T23:00:00"
  power_cut:            "1988-12-24T23:15:00"
  roof_setup:           "1988-12-24T23:30:00"
  final_act:            "1988-12-24T23:45:00"
  midnight:             "1988-12-25T00:00:00"

# ── Seal Codes ───────────────────────────────────────────────────
seals:
  1:
    code: "2512"
    description: "Lobby security override code"
    index: nakatomi_access
    sourcetype: "nakatomi:access:badge"
    embed_field: detail
    embed_value: "security override engaged, vault protocol initiated, access_code=2512"

  2:
    code: "7439"
    description: "Vault maintenance cycle"
    index: nakatomi_access
    sourcetype: "nakatomi:access:badge"
    embed_field: detail
    embed_value: "exec_calendar: vault maintenance cycle 7439 — rotation scheduled 1988-12-25T02:00"

  3:
    code: "4291"
    description: "Takagi's failed input sequence"
    index: nakatomi_vault
    sourcetype: "nakatomi:vault:attempt"
    embed_field: detail
    embed_sequence: ["input=4", "input=2", "input=9", "input=1"]

  4:
    code: "8086"
    description: "HVAC encoded message (ROT13)"
    index: nakatomi_building
    sourcetype: "nakatomi:building:hvac"
    embed_field: encoded_message
    embed_value_rot13: "THERE IS NO POWER WITHOUT CODE 8086"

  5:
    code: "5765"
    description: "FBI tactical authorization"
    index: nakatomi_building
    sourcetype: "nakatomi:building:security"
    embed_field: message
    embed_value: "FBI FIELD CMD // GRID-SEC-7 // AUTH:5765 // PRIORITY:IMMEDIATE // CONFIRM POWER DISCONNECT"

  6:
    code: "3940"
    description: "Vault auth code via employee lookup"
    index: null
    sourcetype: null
    embed_location: "system_codes.csv → clearance_level=LEVEL-5 → vault_auth_code"

  7:
    code: null
    description: "Meta — unplug power (no code)"

