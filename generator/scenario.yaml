# ── Intranet Announcements (v2.9 / Phase 6e — lore bulletin board) ──
# Seven hand-authored, world-building bulletins seeded into
# `index=nakatomi_building sourcetype=intranet:announcements`. They
# are pure texture: none of them contain seal codes, trap codes,
# side-story codes, or easter-egg codes. See docs/NAKATOMI_LORE.md § 5.1
# for the canonical list.
#
# Contributor rules (enforced by generate_intranet_announcements in
# generate.py):
#
#   * Each bulletin must have a unique `bulletin_id`.
#   * Must not contain any 4-digit value that matches a seal, trap,
#     side-story, or easter-egg code. The generator fails loud if a
#     collision is introduced (so a future lore edit can't
#     accidentally duplicate a puzzle answer).
#   * Timestamps are naive PST ISO strings; the generator attaches
#     the scenario TZ_OFFSET so `_time` lines up with the rest of
#     the dataset.
#   * Always run in BOTH booth and full modes — total volume is
#     trivial (~7 events) and even a 5-minute demo should be able
#     to surface the "CEO Holiday Message" bulletin for a curious
#     booth visitor.
announcements:
  - bulletin_id: "ANN-88-CEO-HOLIDAY"
    timestamp: "1988-12-20T09:00:00"
    author: "J.Takagi"
    author_name: "Joseph Takagi"
    author_title: "CEO, Nakatomi Trading"
    department: "Executive"
    subject: "Holiday Message from the CEO"
    message: "A year ago this month, the Room 30-B incident reminded us that the people in this building — not the glass around them — are what make Nakatomi work. We close out this year with our strongest Q4 in the Pacific division's history, in a tower that celebrates its 13th birthday next July. I am grateful for every one of you. Enjoy the party. Go home safely. Merry Christmas."

  - bulletin_id: "ANN-88-HR-RSVP"
    timestamp: "1988-12-22T10:30:00"
    author: "hr.events"
    author_name: "Olivia Park-Hammond"
    author_title: "Head of HR"
    department: "HR"
    subject: "Christmas Party RSVP — Final Call"
    message: "Final RSVP reminder: the Christmas party begins Friday Dec 24 at 20:00 on Floor 30. Dress is business formal. Plus-ones welcome but must be pre-registered with Cyrus (Floor 1 reception) by EOD Thursday. Guests without pre-registration will not be issued a visitor badge. No exceptions."

  - bulletin_id: "ANN-88-FAC-HVAC"
    timestamp: "1988-12-22T13:14:00"
    author: "facilities.ops"
    author_name: "Eduardo Vasquez"
    author_title: "Building Operations Lead"
    department: "Facilities"
    subject: "HVAC Zone 4 Service Window — Roof Chiller Maintenance"
    message: "Tri-Air Mechanical (contractor: Halima Senghor, VND-004) on-site Friday Dec 22 approx 13:30 for roof chiller filter service in HVAC Zone 4. Floors 20 and above may see a 2-3 degree temperature drift 14:00-16:30. This is a routine six-monthly visit. No evacuation required."

  - bulletin_id: "ANN-88-SEC-PARKING"
    timestamp: "1988-12-22T16:15:00"
    author: "sec.ops"
    author_name: "James Marsh"
    author_title: "Senior Security Lead"
    department: "Security"
    subject: "Holiday Parking Adjustments — B1 / B2"
    message: "Parking Level B2 will run at reduced capacity Friday evening Dec 24 to accommodate party-guest vehicles and catering staging. Employees who typically park in B2 are asked to use B1 west side. The vault-access corridor on B1 is OFF LIMITS to employee parking at all times — as always."

  - bulletin_id: "ANN-88-IT-MAINT"
    timestamp: "1988-12-23T20:00:00"
    author: "it.ops"
    author_name: "Mads Sorensen"
    author_title: "IT Operations"
    department: "IT"
    subject: "Scheduled Maintenance — Mail & Proxy"
    message: "R&D's Y2K compatibility pilot (J. Hanada, ENG-2504) will run a small date-rollover test on the legacy mail and proxy fleet overnight Dec 23-24. Brief service blips (under a minute) are possible. The pilot is part of our proactive remediation for the January 1 2000 calendar rollover. No user action required."

  - bulletin_id: "ANN-88-FAC-ANNIVERSARY"
    timestamp: "1988-12-17T08:00:00"
    author: "facilities.ops"
    author_name: "Eduardo Vasquez"
    author_title: "Building Operations Lead"
    department: "Facilities"
    subject: "Plaza Anniversary Note — Thirteen Years In"
    message: "Nakatomi Plaza turns thirteen next July. If you've been here a while you'll remember the October 1985 elevator fire and the fire-suppression retrofit that followed in 1986. Most of you won't — and that's the point. The building today is safer, quieter, and better maintained than at any time since topping out. Thank you to the Facilities and Security teams who make that true every single day."

  - bulletin_id: "ANN-88-SEC-DRILL"
    timestamp: "1988-12-19T11:00:00"
    author: "sec.ops"
    author_name: "James Marsh"
    author_title: "Senior Security Lead"
    department: "Security"
    subject: "Fire-Safety Drill Recap — Dec 17"
    message: "Thank you to every floor for full participation in Monday's drill. Evacuation time was 7 minutes 42 seconds — our fastest since the 1985 fire. The lessons from 1985 and 1987 still shape how we run these drills; if either year means nothing to you, ask a colleague who was here. The answer is worth asking."

