# NOTE: The game story is set in December 1988. Some lore / easter-egg events
# (intranet announcements, intercepted comms, McClane's "yippee", Morse "DAD",
# Hans's "ho ho ho", Argyle's limo radio) are deliberately stamped with 1988
# timestamps for in-world authenticity. Splunk's default quarantinePastSecs
# (900 days) would quarantine those events as "too old" and they would not be
# searchable, and the default frozenTimePeriodInSecs (~6 years) would freeze
# them. The four event indexes below therefore widen the past-event window and
# disable time-based freezing so 1988-dated events ingest and remain searchable.
#   quarantinePastSecs    = ~270 years  (accept events back to ~1756)
#   frozenTimePeriodInSecs = ~136 years (effectively never freeze on age)
# These do NOT change event timestamps — the 1988 story stays intact.

[nakatomi_access]
homePath = $SPLUNK_DB/nakatomi_access/db
coldPath = $SPLUNK_DB/nakatomi_access/colddb
thawedPath = $SPLUNK_DB/nakatomi_access/thaweddb
quarantinePastSecs = 8640000000
frozenTimePeriodInSecs = 4294967295

[nakatomi_vault]
homePath = $SPLUNK_DB/nakatomi_vault/db
coldPath = $SPLUNK_DB/nakatomi_vault/colddb
thawedPath = $SPLUNK_DB/nakatomi_vault/thaweddb
quarantinePastSecs = 8640000000
frozenTimePeriodInSecs = 4294967295

[nakatomi_building]
homePath = $SPLUNK_DB/nakatomi_building/db
coldPath = $SPLUNK_DB/nakatomi_building/colddb
thawedPath = $SPLUNK_DB/nakatomi_building/thaweddb
quarantinePastSecs = 8640000000
frozenTimePeriodInSecs = 4294967295

[nakatomi_comms]
homePath = $SPLUNK_DB/nakatomi_comms/db
coldPath = $SPLUNK_DB/nakatomi_comms/colddb
thawedPath = $SPLUNK_DB/nakatomi_comms/thaweddb
quarantinePastSecs = 8640000000
frozenTimePeriodInSecs = 4294967295

[nakatomi_sessions]
homePath = $SPLUNK_DB/nakatomi_sessions/db
coldPath = $SPLUNK_DB/nakatomi_sessions/colddb
thawedPath = $SPLUNK_DB/nakatomi_sessions/thaweddb
# 90 day retention for live-session telemetry (privacy / governance — see docs/DEPLOY.md)
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 5120
