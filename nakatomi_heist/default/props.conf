# v2.4 — live game-session telemetry (HEC, JSON, no PII beyond user-supplied team_name).
# Field aliases below give the facilitator dashboards a stable schema even if the upstream
# JSON shape evolves. KV_MODE=json already auto-extracts these, but explicit EXTRACTs make
# behavior identical on Splunk Cloud Victoria/Polaris and Splunk Enterprise 9.x/10.x.
[nakatomi:session:event]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 16384
EXTRACT-team_code = "team_code":\s*"(?<team_code>[^"]*)"
EXTRACT-team_name = "team_name":\s*"(?<team_name>[^"]*)"
EXTRACT-session_id = "session_id":\s*"(?<session_id>[^"]*)"
EXTRACT-event_type = "event_type":\s*"(?<event_type>[^"]*)"
EXTRACT-difficulty = "difficulty":\s*"(?<difficulty>[^"]*)"
EXTRACT-mode = "mode":\s*"(?<mode>[^"]*)"
EXTRACT-act = "act":\s*(?<act>\d+)
EXTRACT-task_id = "task_id":\s*"(?<task_id>[^"]*)"
EXTRACT-task_name = "task_name":\s*"(?<task_name>[^"]*)"
EXTRACT-booth_id = "booth_id":\s*"(?<booth_id>[^"]*)"
EXTRACT-scenario = "scenario":\s*"(?<scenario>[^"]*)"
EXTRACT-outcome = "outcome":\s*"(?<outcome>[^"]*)"
EXTRACT-reason = "reason":\s*"(?<reason>[^"]*)"
EXTRACT-achievement_id = "achievement_id":\s*"(?<achievement_id>[^"]*)"
EXTRACT-score = "score":\s*(?<score>\d+)
EXTRACT-score_scaled = "score_scaled":\s*(?<score_scaled>\d+)
EXTRACT-elapsed_seconds = "elapsed_seconds":\s*(?<elapsed_seconds>\d+)
EXTRACT-completed_tasks = "completed_tasks":\s*(?<completed_tasks>\d+)
EXTRACT-total_tasks = "total_tasks":\s*(?<total_tasks>\d+)
EXTRACT-wrong_count = "wrong_count":\s*(?<wrong_count>\d+)
EXTRACT-hints_used = "hints_used":\s*(?<hints_used>\d+)
EXTRACT-hint_level = "hint_level":\s*(?<hint_level>\d+)
# v2.6 hint-token economy: spent counter is per-event (hint_token_spent),
# initial/spent/remaining roll-ups appear on session_end. Patterns are
# anchored on the JSON key so missing values don't pollute extracted fields.
EXTRACT-hint_tokens_initial = "hint_tokens_initial":\s*(?<hint_tokens_initial>\d+)
EXTRACT-hint_tokens_spent = "hint_tokens_spent":\s*(?<hint_tokens_spent>\d+)
EXTRACT-hint_tokens_remaining = "hint_tokens_remaining":\s*(?<hint_tokens_remaining>\d+)
EXTRACT-tokens_initial = "tokens_initial":\s*(?<tokens_initial>\d+)
EXTRACT-tokens_remaining = "tokens_remaining":\s*(?<tokens_remaining>\d+)
# v2.9 / Phase 6 — side-story discovery telemetry. Per-event fields
# appear on side_story_discovered events; the roll-up fields appear on
# session_end so dashboards can answer "how curious was this team?"
# without a second query. Patterns anchored on the JSON key so missing
# values don't create extracted-field noise.
EXTRACT-story_id = "story_id":\s*"(?<story_id>[^"]*)"
EXTRACT-story_title = "story_title":\s*"(?<story_title>[^"]*)"
EXTRACT-discovered_count = "discovered_count":\s*(?<discovered_count>\d+)
EXTRACT-total_stories = "total_stories":\s*(?<total_stories>\d+)
EXTRACT-side_stories_discovered = "side_stories_discovered":\s*(?<side_stories_discovered>\d+)
EXTRACT-side_stories_total = "side_stories_total":\s*(?<side_stories_total>\d+)
EXTRACT-side_stories_ids = "side_stories_ids":\s*"(?<side_stories_ids>[^"]*)"
# v2.9 / Phase 6 — trap-code lore (red herrings). trap_code carries the
# 4-digit decoy the team entered; has_lore flags whether we showed them
# a narrative explanation. Facilitator dashboards use these to see which
# decoys land most often, and whether the lore toast correlates with
# fewer subsequent wrong answers.
EXTRACT-trap_code = "trap_code":\s*"(?<trap_code>[^"]*)"
EXTRACT-has_lore = "has_lore":\s*"(?<has_lore>[^"]*)"
# v2.9 / Phase 6d — easter-egg discovery telemetry. Per-event fields appear
# on easter_egg_found events; the roll-up fields appear on session_end so
# dashboards can rank teams by both side-story and easter-egg discovery
# scores side-by-side. `trigger` is always "keypad" today but reserved for
# "konami" and future gesture-based eggs so we don't have to re-extract later.
EXTRACT-egg_id = "egg_id":\s*"(?<egg_id>[^"]*)"
EXTRACT-egg_title = "egg_title":\s*"(?<egg_title>[^"]*)"
EXTRACT-trigger = "trigger":\s*"(?<trigger>[^"]*)"
EXTRACT-total_eggs = "total_eggs":\s*(?<total_eggs>\d+)
EXTRACT-easter_eggs_found = "easter_eggs_found":\s*(?<easter_eggs_found>\d+)
EXTRACT-easter_eggs_total = "easter_eggs_total":\s*(?<easter_eggs_total>\d+)
EXTRACT-easter_eggs_ids = "easter_eggs_ids":\s*"(?<easter_eggs_ids>[^"]*)"
# v2.10 / Phase 5i — adaptive-antagonist metadata. The full transcript
# for each Hans reaction lives on sourcetype=intercept:hans in
# nakatomi_comms (see [intercept:hans] above); the fields below appear
# on the matching event_type=hans_reaction record in nakatomi_sessions
# so facilitator dashboards can count reactions, break down by trigger,
# and correlate tone against team performance WITHOUT having to cross
# indexes. reaction_id is the stable join key between the two.
EXTRACT-reaction_id = "reaction_id":\s*"(?<reaction_id>[^"]*)"
EXTRACT-tone = "tone":\s*"(?<tone>[^"]*)"
EXTRACT-channel = "channel":\s*"(?<channel>[^"]*)"
EXTRACT-speaker = "speaker":\s*"(?<speaker>[^"]*)"
# v2.10 / Phase 5i — facilitator-triggered phone-call cinematic. Three
# lifecycle events appear on nakatomi_sessions: phone_call_incoming (call
# queued, populates caller + delivery_type + line_preset_id), phone_call_answered
# (player accepted, populates latency_ms between ring and accept), and
# phone_call_missed (facilitator cancelled or player ignored, populates
# ring_duration_ms). Raw ad-hoc transcripts are intentionally NOT emitted
# so live facilitator improvisation stays off the wire — only the preset
# line id is captured. caller is {powell, hans, holly}; delivery_type is
# {preset, adhoc}. Patterns anchored on the JSON key so session_end
# records without these fields don't produce extracted-field noise.
EXTRACT-caller = "caller":\s*"(?<caller>[^"]*)"
EXTRACT-delivery_type = "delivery_type":\s*"(?<delivery_type>[^"]*)"
EXTRACT-line_preset_id = "line_preset_id":\s*"(?<line_preset_id>[^"]*)"
EXTRACT-latency_ms = "latency_ms":\s*(?<latency_ms>\d+)
EXTRACT-ring_duration_ms = "ring_duration_ms":\s*(?<ring_duration_ms>\d+)
# v2.11 / Phase 8a — free-roam Floor-30 hub overlay. Three lifecycle events
# appear on nakatomi_sessions: hub_opened (overlay shown — carries
# available/locked/hidden_station_count), hub_closed (overlay dismissed —
# carries elapsed_ms session-local dwell time and interactions count), and
# hub_station_clicked (station activation — carries station_id from the
# STATION_IDS allow-list and availability ∈ {available, locked, hidden}).
# `trigger` is already extracted above (easter-egg block); the same pattern
# captures hub triggers ∈ {hotkey, pause_menu, autoload, station_click,
# esc, backdrop_click, game_over, reset} so no duplicate stanza needed.
# station_id is an allow-listed enum; a compromised caller emitting a
# station_id outside STATION_IDS is dropped at emit time in the UI.
EXTRACT-station_id = "station_id":\s*"(?<station_id>[^"]*)"
EXTRACT-availability = "availability":\s*"(?<availability>[^"]*)"
EXTRACT-elapsed_ms = "elapsed_ms":\s*(?<elapsed_ms>\d+)
EXTRACT-interactions = "interactions":\s*(?<interactions>\d+)
EXTRACT-available_station_count = "available_station_count":\s*(?<available_station_count>\d+)
EXTRACT-locked_station_count = "locked_station_count":\s*(?<locked_station_count>\d+)
EXTRACT-hidden_station_count = "hidden_station_count":\s*(?<hidden_station_count>\d+)
# v2.12 / Phase 7 Tier 1 — ending-only branches. A single ending_classified
# event is emitted per victory with ending_id ∈ {analyst, cowboy, speedrunner,
# default}. Performance signals (elapsed_seconds, wrong_count,
# hint_tokens_spent, side_stories_discovered, difficulty, mode, act) are
# already extracted above — they're re-sent on this event so the
# classification is auditable without joining back to session_end. The same
# ending_id surfaces on the matching achievement_unlocked record
# (achievement_id ∈ {ending_analyst, ending_cowboy, ending_speedrunner,
# ending_default}) via the existing achievement_id extraction, so
# downstream dashboards can pivot on either field. Payload contains no
# raw SPL text, no PII beyond the opt-in team_code, and no DOM content.
EXTRACT-ending_id = "ending_id":\s*"(?<ending_id>[^"]*)"
# v2.13 / Phase 5c — kiosk hardening telemetry. Three new event_types
# (kiosk_activated / kiosk_idle_reset / kiosk_watchdog_reload) plus the
# Phase 5b splunk_fallback fixture-served beacon. Field set is small and
# scrupulously non-PII: kiosk_mode (gameplay|queue), idle_ms / watchdog_ms
# (the configured timers, useful for spotting URL-param overrides), reason
# (idle|timeout|operator), uptime_ms (how long the watchdog let the page
# run), and the existing task_id (from the fallback beacon — already
# extracted above for task_complete events). All values are static strings
# or integers; no raw URLs, no fragments of SPL, no team-code echo.
EXTRACT-kiosk_mode = "mode":\s*"(?<kiosk_mode>gameplay|queue)"
EXTRACT-idle_ms = "idle_ms":\s*(?<idle_ms>\d+)
EXTRACT-watchdog_ms = "watchdog_ms":\s*(?<watchdog_ms>\d+)
EXTRACT-uptime_ms = "uptime_ms":\s*(?<uptime_ms>\d+)
EXTRACT-kiosk_reason = "reason":\s*"(?<kiosk_reason>[a-z_]{1,32})"
# v2.13 / Phase 5d/5e — Facilitator booth telemetry. Three new event_types:
# session_feedback (rating 0-5, comment_length, comment text up to 120 chars
# already sanitized of CR/LF/<>/control chars at emit time, elapsed_seconds),
# session_abandoned (exit_act, exit_task, last_seen_seconds — fires when a
# booth visitor walks away mid-session and triggerVictory/GameOver never
# closes the loop), and facilitator_action (action ∈ {complete, powercut,
# end_session, reset}, optional task_id). All fields are bounded-length
# alphanumerics or short integers. comment is captured to support live NPS
# review at booths but field is bounded at 120 chars by client + a simple
# 200-char regex cap below to defend Splunk-side against any future client
# bypass; the field already passes through input sanitisation in
# _sanitizeFeedbackText() (game.html v2.13).
EXTRACT-rating = "rating":\s*(?<rating>\d{1,2})
EXTRACT-comment_length = "comment_length":\s*(?<comment_length>\d{1,4})
EXTRACT-feedback_comment = "comment":\s*"(?<feedback_comment>[^"]{0,200})"
EXTRACT-skipped = "skipped":\s*(?<skipped>true|false)
EXTRACT-exit_act = "exit_act":\s*(?<exit_act>\d{1,3})
EXTRACT-exit_task = "exit_task":\s*"(?<exit_task>[A-Za-z0-9._-]{0,16})"
EXTRACT-last_seen_seconds = "last_seen_seconds":\s*(?<last_seen_seconds>\d{1,7})
EXTRACT-fac_action = "action":\s*"(?<fac_action>[a-z_]{1,32})"
# v2.14 / Phase 5h — audio mix telemetry. audio_setting_changed events
# carry a setting name (master|music|sfx|ambient|mono|reducedIntensity|
# captions — fixed allow-list, never user-controlled) and a numeric or
# boolean value. The setting name is bounded by [a-zA-Z]{1,24}; the
# value extraction is intentionally a separate rule (not the existing
# numeric `value` field, which other events use) so that future
# dashboards can correlate by setting name without false matches.
EXTRACT-audio_setting = "setting":\s*"(?<audio_setting>[a-zA-Z]{1,24})"
EXTRACT-audio_value = "value":\s*(?<audio_value>(?:true|false|0|1|0?\.\d{1,4}))
