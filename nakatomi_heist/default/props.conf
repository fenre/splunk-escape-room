# v2.9 / Phase 6 — hand-authored Hans / McClane / Argyle / Morse
# intercepts generated into nakatomi_comms as key=value lines with
# a leading ISO-8601 timestamp. Shares the same shape as the Phase
# 5i adaptive intercepts, which are emitted live from game.html
# (see below) so a single stanza serves both.
[intercept:hans]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# v2.10 / Phase 5i — adaptive antagonist reactions. reaction_id
# maps back to the HANS_REACTIONS registry in game.html, trigger
# is one of {idle, lazy_queries, keypad_spam, fast_solves,
# side_story_discoveries, konami_code}, tone is {light, sinister}.
# KV_MODE=auto already extracts these; explicit EXTRACTs below
# make behavior identical across Splunk Enterprise 9.x/10.x and
# Splunk Cloud Victoria/Polaris.
EXTRACT-channel = \bchannel=(?<channel>[^\s"]+|"[^"]*")
EXTRACT-speaker = \bspeaker=(?<speaker>[^\s"]+|"[^"]*")
EXTRACT-reaction_id = \breaction_id=(?<reaction_id>[A-Za-z0-9_\-]+)
EXTRACT-trigger = \btrigger=(?<trigger>[A-Za-z0-9_\-]+)
EXTRACT-tone = \btone=(?<tone>light|sinister)
EXTRACT-act = \bact=(?<act>\d+)

[intercept:mcclane]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
