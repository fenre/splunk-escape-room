[launcher]
author = Nakatomi Vault Heist Project
description = A Splunk-powered inverse escape room. Five acts, 26 tasks, ~47k events, 8 optional side mysteries, 29 scripted red-herring events, four trap codes with narrative lore on miss, 15 hidden easter eggs, and 7 lore bulletins. v2.17 extends the facilitator board to 1920x3600 with three new rows surfacing v2.13/v2.14/v2.16 telemetry: BOOTH KIOSK OPERATIONS (kiosk_activated KPI + idle reset reasons + recent watchdog reloads/idle resets), POST-SESSION FEEDBACK + ABANDONMENT (avg rating KPI + 5-star distribution + abandonment funnel by exit act), and OPERATOR ACTIVITY (facilitator click count KPI + facilitator action verb mix + audio mix tweak distribution). Eighteen new visualizations, nine new data sources, all booth-token scoped, zero new event types — wholly additive minor bump. v2.16 ships the scenario-pack v2 schema (?scenario=default|roof|afterparty) and the i18n scaffold (?lang=en|es|de|ja with i18n/en.json + i18n/es.json) — pragmatic Q3+Q4+Phase 5f scope; both modules apply pure JSON overlays on top of the canonical inline content with allow-listed names, length-capped values, prototype-pollution defenses, and file:// fallback. Combined regression now 923 assertions across 11 modules. v2.15 ships the cross-cutting quality gate: a unified test runner (scripts/test.sh) wrapping 840 assertions across 10 modules, a new scenario-consistency regression test that catches generator drift breaking puzzles silently, the GitHub Actions CI workflow (tests + HTML/conf-file syntax + secret-scan + tagged-build .spl artifact), Dependabot scaffolding, and a complete GDPR/DSAR governance bundle (export_sessions.sh + purge_sessions.sh + KV-Store 30-day pruning saved-search recipe + DEPLOY.md section). All Q-track work is wholly additive — zero gameplay changes. v2.14 lands the adaptive 3-layer audio engine (ambient / music / SFX gain buses with crossfade), Beethoven's Ode to Joy synthesized on vault-open for the default ending, per-act 5-note arpeggio motifs (one per act so players unconsciously learn each act's signature), an in-pause Audio Mix panel (master / music / SFX / ambient sliders + mono / reduced-intensity / captions toggles), an audio captions HUD for Deaf/HoH players (text label per cue, ~2s fade), and audio_setting_changed telemetry. v2.13 ships the full Phase 5 booth-mode bundle: two new short-form difficulties (Quickfire — 5 min / 2 tasks / 0.25x; Booth Heist — 10 min / 3 tasks / 0.5x) with pre-filled SPL + golden-path fixture cache for wifi-loss resilience + a fast 3-second boot path; ?kiosk=1 hardening (full-screen, shortcut guard, 90-second auto-return on victory/game-over, hourly watchdog reload, leaderboard storage cap raised 10→50, ?queue=1 secondary-display variant); ?facilitator=1 in-game tab bypassing the PIN with a live team-code + elapsed-time + progress header; a Splunk linkout button on the victory screen (HTTPS-validated config-only URL, never URL-param); a 1-question session feedback widget (5-star + 120-char comment, sanitized); and abandonment-tracking telemetry that fires session_abandoned when a booth visitor walks away mid-session. Five new event_types, eight new props.conf extractions. v2.12 adds ending-only branches — four tonal Act-5 outcomes (Analyst, Cowboy, Speedrunner, default) decided on victory from cumulative performance, each with a unique narrative beat, audio sting, and achievement; a new ending_classified telemetry event powers the facilitator board's ending-distribution panel and priors the Phase 7 Tier 2 mid-game fork. v2.11 shipped the free-roam Floor-30 hub (seven clickable stations — terminal, keypad, leads, briefing, blueprint, comms, board — with a blueprint-style overlay, M hotkey, and facilitator analytics for station clicks and dwell time). v2.10 added Adaptive Hans (36 reactive antagonist lines on six telemetry triggers), a facilitator phone-call cinematic (Powell / Hans / Holly voiced via SpeechSynthesis, audio-ducked), and an in-game investigation board (drag-drop corkboard with red-string threads, freehand notes, suspect flags, and 1080p PNG export). v2.9 bundles 60 named NPCs, side mysteries, red herrings, easter eggs, the lore codex (docs/NAKATOMI_LORE.md), booth mode, and the nakatomi_comms index. v2.6 added the hint-token economy and Iron Man mode. v2.4 added opt-in session telemetry, multi-team codes, and the facilitator board.
version = 2.17.1

[package]
id = nakatomi_heist
check_for_updates = false
